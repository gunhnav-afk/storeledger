project_id = "ThienBaoClothes"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[auth]
enabled = true
site_url = "https://thienbaoclothes.vercel.app"
additional_redirect_urls = [
  "https://thienbaoclothes.vercel.app/**",
  "https://*.vercel.app/**",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[functions.admin-users]
enabled = true
verify_jwt = false
import_map = "./functions/admin-users/deno.json"
entrypoint = "./functions/admin-users/index.ts"
