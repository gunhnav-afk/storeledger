# Giữ cả 2 cụm project Supabase (StoreLedger & ThienBaoClothes - gói miễn phí) không bị tạm dừng:
# cứ 2 ngày gửi một truy vấn nhỏ tới từng database qua REST API.
name: Keep Supabase alive

on:
  schedule:
    - cron: '0 1 */2 * *' # 01:00 UTC (08:00 giờ Việt Nam), 2 ngày một lần
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping StoreLedger & ThienBaoClothes databases
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://azzhgwqtiiutuctqdtxv.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_kOOnLGRcp-a_KOH_hOfKsQ_SF8Fb4XL' }}
          THIENBAO_SUPABASE_URL: 'https://zfawfaqqvfqzydnhrhkq.supabase.co'
          THIENBAO_SUPABASE_ANON_KEY: 'sb_publishable_YMTCq9DdUV4gFZM6oGcvMA_sGjIEier'
        run: |
          ping_project() {
            local name="$1"
            local url="$2"
            local key="$3"
            local table="$4"
            echo "Target Supabase project ($name): $url"
            code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 30 \
              "$url/rest/v1/$table?select=id&limit=1" \
              -H "apikey: $key" -H "Authorization: Bearer $key" || echo 000)
            echo "$name HTTP $code"
            case "$code" in
              200|401|403|404) echo "$name đang hoạt động tốt" ;;
              *) echo "::error::$name không phản hồi bình thường (HTTP $code)."; cat /tmp/body.txt; exit 1 ;;
            esac
          }

          ping_project "StoreLedger" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "stores"
          ping_project "ThienBaoClothes" "$THIENBAO_SUPABASE_URL" "$THIENBAO_SUPABASE_ANON_KEY" "workshop_settings"
